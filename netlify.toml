# Netlify configuration — security headers + redirect rules
# This file is also read by some CDN proxies

[build]
  publish = "."

# ── Force HTTPS & WWW ──────────────────────────────────────────────────────────
[[redirects]]
  from = "http://truepocket.live/*"
  to   = "https://www.truepocket.live/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.truepocket.live/*"
  to   = "https://www.truepocket.live/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://truepocket.live/*"
  to   = "https://www.truepocket.live/:splat"
  status = 301
  force  = true

# ── Global security headers ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options       = "nosniff"
    X-Frame-Options              = "DENY"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-XSS-Protection             = "1; mode=block"
    Content-Security-Policy      = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com https://images.unsplash.com https://www.truepocket.live https://www.facebook.com; connect-src 'self' https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# ── APK download headers ──────────────────────────────────────────────────────
[[headers]]
  for = "/TruePocket.apk"
  [headers.values]
    Content-Disposition = "attachment; filename=\"TruePocket.apk\""
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/downloads/truepocket.apk"
  [headers.values]
    Content-Disposition = "attachment; filename=\"TruePocket.apk\""
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=86400"

# ── Cache static assets aggressively ──────────────────────────────────────────
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML pages — always fresh ─────────────────────────────────────────────────
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
