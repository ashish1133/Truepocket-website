<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20" fill="#EFF6FF"/>

  <!-- Grey track ring -->
  <circle cx="50" cy="52" r="32" fill="none" stroke="#E2E8F0" stroke-width="6"/>

  <!-- Blue arc: start at top (50,20), sweep ~300deg clockwise, end at bottom-left -->
  <!-- Start: (50, 52-32) = (50, 20) -->
  <!-- End ~210deg: (50 + 32*cos210, 52 + 32*sin210) = (50-27.7, 52+16) = (22.3, 68) -->
  <path d="M 50 20 A 32 32 0 1 1 22.3 68"
        fill="none"
        stroke="url(#blueGrad)"
        stroke-width="7"
        stroke-linecap="round"/>

  <!-- Gold capsule tip at end of arc (~210deg) -->
  <ellipse cx="24.5" cy="65" rx="6.5" ry="4.5"
           fill="url(#goldGrad)"
           transform="rotate(-30 24.5 65)"/>
</svg>
